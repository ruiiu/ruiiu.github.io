title: Rui Liu
name: Rui Liu
position: Ph.D. candidate in Computer Science, University of Maryland
email: ruiliu@umd.edu
description: >-
  I am a Ph.D. candidate in [Computer Science](https://www.cs.umd.edu/) at the University of Maryland, College Park,
  advised by Prof. [Pratap Tokekar](http://tokekar.com) and Prof. [Ming Lin](https://www.cs.umd.edu/~lin).
  I have interned at Netflix Research, Tencent Hunyuan LLM Frontier & AI Lab, Apple, and Tencent Robotics X,
  and I received my bachelor's degree from [Shanghai Jiao Tong University](https://en.sjtu.edu.cn/).


  My research focuses on **post-training large language models**: **reinforcement learning**, **reward modeling**,
  and **agentic LLMs** that can **recursively improve themselves**. My work aims to make RL for LLMs
  stable and sample-efficient, rewards harder to game, and reasoning robust to noisy or degraded inputs.
# Removed from the bio (kept for reference):
#   This grows out of my earlier work on robust and multimodal learning for multi-agent systems and robotics.
# Short version used for search engines and link previews.
meta_description: >-
  Rui Liu, Ph.D. candidate at the University of Maryland working on LLM post-training, reinforcement learning,
  reward modeling, agentic LLMs, and recursive self-improvement.
